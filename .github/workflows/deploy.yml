name: Deploy til Hetzner

# Kjører automatisk ved push til produksjonsgrenen, og kan trigges manuelt.
# Bytt branches-verdien til [main] den dagen PR-en merges og main blir
# den grenen som faktisk kjører på serveren.
on:
  push:
    branches: [claude/race-timing-webapp-gjx43b]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/timer
            git fetch origin claude/race-timing-webapp-gjx43b
            git checkout claude/race-timing-webapp-gjx43b
            git reset --hard origin/claude/race-timing-webapp-gjx43b
            docker compose up -d --build
