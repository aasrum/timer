services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # Kun localhost: en eksisterende nginx på hosten terminerer TLS for
      # timer.ntggeilo.no og reverse-proxyer hit. Se README/DEPLOY.
      - "127.0.0.1:5080:80"
    depends_on:
      - api

  api:
    build: ./server
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - api_data:/data

volumes:
  api_data:
